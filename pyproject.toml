[project]
name = "production"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abed Al Majeed Kanso", email = "abedkansof18@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "langchain>=1.3.14",
    "langchain-chroma>=1.1.0",
    "langchain-classic>=1.0.8",
    "langchain-core>=1.5.3",
    "langchain-google-genai>=4.3.2",
    "langchain-groq>=1.1.3",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.10",
    "langsmith>=0.10.17",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.2",
    "slowapi>=0.1.10",
    "uvicorn>=0.52.1",
]

[tool.uv]
package = false

[project.scripts]
production = "production:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
